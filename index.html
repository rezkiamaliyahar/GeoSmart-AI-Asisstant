<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSmart AI Assistant</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f7f7;
        }
        #chat-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <script src="https://coze.com"></script>
    <script>
        new CozeWebSDK.WebChat({
            config: {
                bot_id: '7683338426799783989',
            },
            componentProps: {
                title: 'GeoSmart AI Assistant',
            },
            el: document.getElementById('chat-container'),
            ui: {
                asComponent: true
            }
        });
    </script>

</body>
</html>
