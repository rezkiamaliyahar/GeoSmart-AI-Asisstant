<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Memaksa halaman dan layout chat memenuhi layar penuh */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f7f7;

            width: 100%;
            height: 100%;

                bot_id: '7683338426799783989', // ⚠️ GANTI INI dengan ID Bot Coze asli Anda!

            componentProps: {
                title: 'GeoSmart AI Assistant',
            },
            el: document.getElementById('chat-container'), // Memasang chat ke wadah di atas
            ui: {
                asComponent: true // Mengubah chat dari tombol melayang menjadi satu halaman penuh
            }
        });
    </script>

</body>
</html>
